<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Hub CRM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="img/icone-32.png">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apex Hub">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#3b6ea8;--verde-2:#2f5a8c;--verde-claro:#e8eef7;
  --enrico:#3b6ea8;--enrico-claro:#e8eef7;--otavio:#2563eb;--otavio-claro:#e3ecfd;
  --bg:#f4f5f7;--card:#ffffff;--card-2:#f8f9fb;--txt:#15181d;--txt-2:#5a616c;--txt-3:#8a919c;--linha:#e2e5ea;
  --alerta:#c2410c;--alerta-claro:#fff1e7;--ok:#15803d;--sombra:0 1px 2px rgba(16,24,20,.06),0 4px 16px rgba(16,24,20,.06);
  --raio:12px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --verde:#4d80c4;--verde-2:#6f9fd6;--verde-claro:#17202c;--enrico:#4d80c4;--enrico-claro:#17202c;--otavio:#4f86f7;--otavio-claro:#16233f;
  --bg:#0b0d10;--card:#14171b;--card-2:#191d22;--txt:#eceef1;--txt-2:#a7aeb8;--txt-3:#747c87;--linha:#262b32;--alerta:#fb923c;--alerta-claro:#33200f;--ok:#4ade80;--sombra:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --verde:#4d80c4;--verde-2:#6f9fd6;--verde-claro:#17202c;--enrico:#4d80c4;--enrico-claro:#17202c;--otavio:#4f86f7;--otavio-claro:#16233f;
  --bg:#0b0d10;--card:#14171b;--card-2:#191d22;--txt:#eceef1;--txt-2:#a7aeb8;--txt-3:#747c87;--linha:#262b32;--alerta:#fb923c;--alerta-claro:#33200f;--ok:#4ade80;--sombra:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:var(--card);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--txt)}
.btn:hover{border-color:var(--txt-3)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.pri:hover{background:var(--verde-2)}
.btn.peq{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.fant{border-color:transparent;background:transparent}
.btn.fant:hover{background:var(--card-2)}
.btn.perigo{color:var(--enrico)}
.btn:disabled{opacity:.55;cursor:default}
input.campo,select.campo,textarea.campo{width:100%;border:1px solid var(--linha);background:var(--card);border-radius:9px;padding:8px 10px;outline:none}
input.campo:focus,select.campo:focus,textarea.campo:focus{border-color:var(--verde);box-shadow:0 0 0 3px color-mix(in srgb,var(--verde) 18%,transparent)}
textarea.campo{resize:vertical;min-height:70px}
label.rot{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin:0 0 4px}
.grade{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card-2);border:1px solid var(--linha);color:var(--txt-2);white-space:nowrap}
.chip.verde{background:var(--verde-claro);border-color:transparent;color:var(--verde)}
.chip.alerta{background:var(--alerta-claro);border-color:transparent;color:var(--alerta)}
.ponto{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.ambos{background:linear-gradient(90deg,var(--enrico) 50%,var(--otavio) 50%)}
.vazio{color:var(--txt-3);text-align:center;padding:22px 10px;font-size:13px}
.muted{color:var(--txt-2)}.peq{font-size:12.5px}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 50% -10%,var(--verde-claro),transparent),var(--bg)}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:28px 24px;box-shadow:var(--sombra)}
.login-box img{height:96px;width:96px;border-radius:22px;background:#000;display:block;margin:0 auto 6px;object-fit:cover}
.login-box h1{text-align:center;font-size:15px;color:var(--txt-2);font-weight:500;margin-bottom:20px}
.erro{color:var(--enrico);font-size:13px;min-height:18px;margin:8px 0 0}

/* app */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--card);border-right:1px solid var(--linha);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .logo{display:flex;align-items:center;gap:8px;padding:4px 8px 14px}
aside .logo img{height:34px;width:34px;border-radius:9px;background:#000;object-fit:cover}
aside .logo .nm{font:800 17px/1 Montserrat,sans-serif;letter-spacing:-.01em;color:var(--txt)}aside .logo .nm span{color:var(--verde)}
aside .logo b{font:800 11px Montserrat,sans-serif;letter-spacing:.08em;color:var(--txt-3);text-transform:uppercase;margin-top:6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--txt-2);font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--card-2);color:var(--txt)}
.nav.ativo{background:var(--verde-claro);color:var(--verde);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cont{margin-left:auto;font-size:11px;font-weight:700;background:var(--verde);color:#fff;border-radius:99px;padding:1px 7px}
aside .rodape{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--linha);padding-top:12px}
.eu{display:flex;align-items:center;gap:8px;padding:4px 6px}
main{min-width:0;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--linha);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topo h2{font-size:19px;margin-right:auto}
.busca-btn{display:flex;align-items:center;gap:8px;min-width:220px;color:var(--txt-3)}
.busca-btn kbd{margin-left:auto;font:600 11px Inter;border:1px solid var(--linha);border-radius:5px;padding:0 5px}
#conteudo{padding:20px 22px 60px;flex:1}
.demo-faixa{background:#fff7d6;color:#6b5200;border-bottom:1px solid #f0dc8a;padding:7px 22px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
:root[data-theme="dark"] .demo-faixa{background:#2b2408;color:#f3dc85;border-color:#4a3d0c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demo-faixa{background:#2b2408;color:#f3dc85;border-color:#4a3d0c}}
.menu-mob{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sombra)}
  aside.aberto{transform:none}
  .menu-mob{display:inline-flex}
  .topo{padding:10px 16px}#conteudo{padding:16px 16px 70px}.demo-faixa{padding:7px 16px}
  .busca-btn{min-width:0}.busca-btn span,.busca-btn kbd{display:none}
}
.cartao{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra)}
.cartao>.cab{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--linha)}
.cartao>.cab h3{font-size:14px;margin-right:auto}
.lista-itens>*{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--linha);cursor:pointer}
.lista-itens>*:last-child{border-bottom:0}
.lista-itens>*:hover{background:var(--card-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi small{display:block;color:var(--txt-2);font-size:12px;font-weight:500}
.kpi b{font-size:26px;font-weight:700;letter-spacing:-.02em;display:block;margin-top:2px}
.kpi.alerta b{color:var(--alerta)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filtros select.campo,.filtros input.campo{width:auto;min-width:130px;padding:6px 9px}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--txt-2);font-weight:500}
.seg button.ativo{background:var(--verde-claro);color:var(--verde);font-weight:600}

/* kanban */
.quadro{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.coluna{background:var(--card-2);border:1px solid var(--linha);border-radius:var(--raio);display:flex;flex-direction:column;max-height:calc(100vh - 190px);min-height:120px}
.coluna.sobre{outline:2px dashed var(--verde);outline-offset:-3px}
.coluna>header{display:flex;align-items:center;gap:7px;padding:10px 12px;font-weight:600;font-size:13px}
.coluna>header small{color:var(--txt-3);font-weight:500;margin-left:auto}
.coluna .itens{padding:0 8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.lead{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:10px 11px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.lead:hover{border-color:var(--txt-3)}
.lead.arrastando{opacity:.5}
.lead .nome{font-weight:600;display:flex;gap:6px;align-items:center}
.lead .nome span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .sub{color:var(--txt-2);font-size:12.5px;margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .pe{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.lead .mover{margin-left:auto;display:none}
@media (hover:none),(max-width:900px){.lead .mover{display:inline-flex}}
table.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--linha);background:var(--card-2);position:sticky;top:0}
.tab td{padding:9px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tab tr:hover td{background:var(--card-2);cursor:pointer}
.rolagem{overflow-x:auto}

/* tarefas */
.obj-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.obj{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px;display:grid;gap:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.obj:hover{border-color:var(--txt-3);transform:translateY(-1px)}
.obj h3{font-size:16px}.obj p{margin:0;color:var(--txt-2)}
.obj .pe{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.obj .barra{height:5px;border-radius:9px;background:var(--linha);overflow:hidden}.obj .barra i{display:block;height:100%;background:var(--verde);border-radius:9px}
.obj.feito{opacity:.75}.obj.feito h3{text-decoration:line-through;text-decoration-color:var(--txt-3)}
.obj.vencido .barra i{background:#d9534f}
.aviso-priv{display:inline-flex;align-items:center;gap:6px;color:var(--txt-2);font-size:13px}
.tquadro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.tquadro{grid-template-columns:1fr}}
.tcol{border-radius:var(--raio);border:1px solid var(--linha);background:var(--card)}
.tcol>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:3px solid var(--cor);border-radius:var(--raio) var(--raio) 0 0;background:color-mix(in srgb,var(--cor) 8%,var(--card))}
.tcol>header h3{font-size:15px}
.tcol>header small{margin-left:auto;color:var(--txt-2)}
.tcol .nova{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--linha)}
.tcol .nova input{padding:6px 9px}
.tarefa{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--linha);align-items:flex-start}
.tarefa:last-child{border-bottom:0}
.tarefa.feita .tt{text-decoration:line-through;color:var(--txt-3)}
.marca{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--cor,var(--txt-3));margin:1px 0 0;cursor:pointer;flex:none;display:grid;place-items:center;background:var(--card)}
.marca:checked{background:var(--cor,var(--verde))}
.marca:checked::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tarefa .corpo{flex:1;min-width:0}
.tarefa .tt{font-weight:500;cursor:pointer;word-break:break-word}
.tarefa .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tarefa .acoes{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.cor-agora{--cor:#d9534f}.cor-semana{--cor:var(--verde)}.cor-depois{--cor:#8a919c}.cor-enrico{--cor:var(--enrico)}.cor-otavio{--cor:var(--otavio)}.cor-ambos{--cor:#7c3aed}
.tcol.cor-ambos>header{border-image:linear-gradient(90deg,var(--enrico),var(--otavio)) 1;border-bottom-width:3px;border-bottom-style:solid}
.marca.ambos{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--enrico),var(--otavio)) border-box}
.marca.ambos:checked{background:linear-gradient(90deg,var(--enrico),var(--otavio))}

/* painel lateral e modais */
.veu{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:80;display:flex;justify-content:flex-end}
.veu.centro{justify-content:center;align-items:flex-start;padding:8vh 16px 16px}
.gaveta{width:min(640px,100%);height:100%;background:var(--bg);overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.gaveta>header{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;background:var(--card);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:2}
.gaveta>header h2{font-size:18px;word-break:break-word}
.gaveta .miolo{padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.modal{width:min(560px,100%);background:var(--card);border:1px solid var(--linha);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:84vh;overflow:auto}
.modal>header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--linha)}
.modal>header h3{margin-right:auto;font-size:16px}
.modal .miolo{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--linha)}
.x{border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--txt-3);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--card-2);color:var(--txt)}
.rapidos{display:flex;gap:6px;flex-wrap:wrap}
.linha-tempo{display:flex;flex-direction:column}
.evento{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha)}
.evento:last-child{border-bottom:0}
.evento .ic{width:28px;height:28px;border-radius:50%;background:var(--card-2);border:1px solid var(--linha);display:grid;place-items:center;flex:none;font-size:13px}
.evento .tx{white-space:pre-wrap;word-break:break-word}
.secao{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px}
.secao>h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.secao>h3 .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.busca-res>*{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.busca-res>*:hover,.busca-res>.sel{background:var(--verde-claro)}
.email-corpo{white-space:pre-wrap;word-break:break-word;background:var(--card-2);border:1px solid var(--linha);border-radius:10px;padding:12px;max-height:50vh;overflow:auto}
.nlido{font-weight:700}
.nlido::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verde);margin-right:6px;vertical-align:middle}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;width:min(420px,calc(100% - 32px))}
.toast{background:#17201b;color:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:sobe .2s}
.toast.erro{background:#991b1b}
.toast button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:3px 9px;cursor:pointer}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}
.check-it{display:flex;gap:8px;align-items:center;padding:4px 0}
.check-it input[type=text]{flex:1}
.carregando{display:grid;place-items:center;min-height:60vh;color:var(--txt-3)}
.giro{width:26px;height:26px;border:3px solid var(--linha);border-top-color:var(--verde);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.st{width:30px;height:30px;border-radius:50%;border:2px solid var(--txt-3);background:var(--card);cursor:pointer;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;padding:0}
.st:hover{border-color:var(--ok)}
.st-feito{background:var(--ok);border-color:var(--ok)}
.st-duvida{background:#f59e0b;border-color:#f59e0b}
.trilha{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0}
.pastas-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.pasta{display:flex;gap:12px;padding:14px;cursor:pointer;align-items:flex-start}
.pasta:hover{border-color:var(--txt-3)}
.pasta-corpo{flex:1;min-width:0}
.pasta-nome{font-weight:600;word-break:break-word;margin-bottom:2px}
.barra{height:6px;background:var(--card-2);border-radius:9px;overflow:hidden;margin:8px 0 3px}
.barra>div{height:100%;background:var(--ok)}
.soltar{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--linha);border-radius:var(--raio);padding:18px;cursor:pointer;background:var(--card);text-align:center}
.soltar:hover,.soltar.sobre{border-color:var(--verde);background:var(--verde-claro)}
.arqs-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media (max-width:640px){.arqs-grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.arq{overflow:hidden;display:flex;flex-direction:column}
.arq.feito .thumb>img,.arq.feito .thumb>video{opacity:.55}
.thumb{position:relative;aspect-ratio:9/12;background:var(--card-2);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ic-arq{font-size:44px}
.thumb .play{position:absolute;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:15px}
.selo{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px}
.selo.duv{background:#f59e0b}
.arq-pe{display:flex;gap:8px;align-items:center;padding:9px 10px}
.arq-nome{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.veu.escuro{background:rgba(5,8,6,.97);padding:0;align-items:stretch}
.visor{width:100%;height:100%;display:flex;flex-direction:column;color:#fff;position:relative}
.visor>header{display:flex;gap:10px;align-items:center;padding:12px 14px}
.visor .x{color:#fff}
.visor-midia{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px;overflow:hidden}
body:has(.visor) #toasts{bottom:auto;top:16px}
.visor-acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
@media (max-width:640px){.visor-acoes .rot-m{display:none}.visor-acoes .btn{padding:8px 11px}}
.visor-midia img,.visor-midia video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.visor-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:34px;cursor:pointer}
.visor-nav.ant{left:10px}.visor-nav.prox{right:10px}
.visor-pe{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.visor-pe .seg{background:#1b211d;border-color:#333}.visor-pe .seg button{color:#cfd6d1}
.visor-pe .seg button.ativo{background:#14532d;color:#fff}
.visor-pe .btn{background:#1b211d;border-color:#333;color:#fff}.visor-pe .btn.pri{background:var(--verde);border-color:var(--verde)}
.visor-pe .btn.perigo{color:#fca5a5}
@media (max-width:640px){.visor-nav{display:none}}
.ia-painel{position:fixed;right:16px;bottom:16px;width:min(420px,calc(100% - 32px));height:min(560px,calc(100vh - 32px));background:var(--card);border:1px solid var(--linha);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:90;display:flex;flex-direction:column}
.ia-painel>header{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.ia-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ia-b{max-width:88%;padding:9px 12px;border-radius:14px;line-height:1.45;word-break:break-word}
.ia-b.eu{align-self:flex-end;background:var(--verde);color:#fff;border-bottom-right-radius:4px}
.ia-b.ia{align-self:flex-start;background:var(--card-2);border:1px solid var(--linha);border-bottom-left-radius:4px}
.ia-dica{color:var(--txt-2);font-size:13px;line-height:1.7;background:var(--card-2);border-radius:12px;padding:10px 12px}
.ia-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--linha);align-items:flex-end}
.ia-form textarea{resize:none;min-height:44px}
@media (max-width:640px){.ia-painel{right:0;bottom:0;width:100%;height:100%;border-radius:0}}
.grade-ph td{min-width:120px;cursor:text}
.grade-ph td:last-child{min-width:0}
.senha-cel{display:inline-flex;align-items:center;gap:2px}
.senha-cel .sv{font:inherit;color:inherit;letter-spacing:normal}
.codigo{font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--card-2);border:1px solid var(--linha);border-radius:9px;padding:10px;white-space:pre-wrap;word-break:break-all}
</style>
<script src="config.js"></script>
<script src="crm-api.js"></script>
</head>
<body>
<div id="inicio" class="carregando"><div class="giro"></div></div>

<section id="login" hidden>
  <form class="login-box" id="fLogin" autocomplete="on">
    <img src="img/logo.png" alt="Apex Hub">
    <h1>Apex Hub CRM</h1>
    <div class="grade">
      <div><label class="rot" for="lEmail">E-mail</label><input class="campo" id="lEmail" type="email" autocomplete="username" required></div>
      <div id="blSenha"><label class="rot" for="lSenha">Senha</label><input class="campo" id="lSenha" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" id="lBtn" style="justify-content:center;padding:10px">Entrar</button>
      <button type="button" class="btn fant peq" id="lEsqueci" style="justify-content:center">Esqueci a senha</button>
    </div>
    <p class="erro" id="lErro" role="alert"></p>
  </form>
  <form class="login-box" id="fNova" hidden>
    <img src="img/logo.png" alt="Apex Hub">
    <h1>Crie uma nova senha</h1>
    <div class="grade">
      <div><label class="rot" for="nSenha">Nova senha (mínimo 8 caracteres)</label><input class="campo" id="nSenha" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn pri" style="justify-content:center;padding:10px">Salvar senha</button>
    </div>
    <p class="erro" id="nErro" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <aside id="lado">
    <div class="logo"><img src="img/marca.png" alt=""><span class="nm">Apex<span>Hub</span></span><b>CRM</b></div>
    <button class="nav" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Início</button>
    <button class="nav" data-v="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M16 4a4 4 0 010 8M22 21c0-3-2-6-5-7"/></svg>Leads e clientes<span class="cont" id="cLeads" hidden></span></button>
    <button class="nav" data-v="tarefas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Tarefas<span class="cont" id="cTarefas" hidden></span></button>
    <button class="nav" data-v="lembretes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3L2 6M19 3l3 3"/></svg>Lembretes<span class="cont" id="cLemb" hidden></span></button>
    <button class="nav" data-v="trabalhos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Trabalhos</button>
    <button class="nav" data-v="projetos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>Projetos</button>
    <button class="nav" data-v="objetivos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Meus objetivos</button>
    <button class="nav" data-v="pastas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 14l2 2 4-4"/></svg>Pastas<span class="cont" id="cPastas" hidden></span></button>
    <button class="nav" data-v="formularios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Formulários</button>
    <button class="nav" data-v="emails"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>E-mails<span class="cont" id="cEmails" hidden></span></button>
    <button class="nav" data-v="conectar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>Conectar projetos</button>
    <div class="rodape">
      <button class="btn peq" id="bLinkForm">🔗 Copiar link do formulário</button>
      <div style="display:flex;gap:6px">
        <button class="btn peq fant" id="bTema" title="Tema claro/escuro">◐ Tema</button>
        <button class="btn peq fant" id="bSair">Sair</button>
      </div>
      <div class="eu" id="euBox"></div>
    </div>
  </aside>
  <main>
    <div class="demo-faixa" id="faixaDemo" hidden>
      <b>Modo prévia</b> · dados de exemplo salvos só neste navegador. Para usar de verdade, preencha o config.js (veja o LEIA-ME).
      <button class="btn peq" id="bResetDemo">Recomeçar exemplo</button>
    </div>
    <div class="topo">
      <button class="btn menu-mob" id="bMenu" aria-label="Menu">☰</button>
      <h2 id="titulo">Início</h2>
      <select class="campo" id="selUnidade" style="width:auto" aria-label="Unidade"></select>
      <button class="btn busca-btn" id="bBusca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Buscar</span><kbd>Ctrl K</kbd></button>
      <button class="btn" id="bIA" title="Assistente de IA">✨ IA</button>
      <button class="btn pri" id="bNovo">+ Novo</button>
    </div>
    <div id="conteudo"></div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';
const A = window.CRM;
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { eu: null, equipe: [], unidades: [], contatos: [], tarefas: [], projetos: [], emails: [], pastas: [], arquivos: [], modelos: [], planos: [], lembretes: [], planilhas: [], objetivos: [], planilhaAtual: null, pastaAtual: null, view: 'inicio', unidade: A.local.get('crm-unidade') || 'todas', filtros: {} };
const ETAPAS = [['novo', 'Novo', '#64748b'], ['em_contato', 'Em contato', '#0ea5e9'], ['proposta', 'Proposta enviada', '#a855f7'], ['negociacao', 'Negociação', '#f59e0b'], ['fechado', 'Fechado', '#16a34a'], ['perdido', 'Perdido', '#9ca3af']];
const ETAPA = Object.fromEntries(ETAPAS.map(([k, n, c]) => [k, { n, c }]));
const ORIGENS = { formulario: 'Formulário', email: 'E-mail', manual: 'Manual', instagram: 'Instagram', whatsapp: 'WhatsApp', indicacao: 'Indicação', anuncio: 'Anúncio', outro: 'Outro' };
const TIPOS = { lead: 'Lead', cliente: 'Cliente', parceiro: 'Parceiro', fornecedor: 'Fornecedor', outro: 'Outro' };
const INTERESSES = { site: 'Site', cardapio: 'Cardápio digital', sistema: 'Sistema', agente_ia: 'Agente de IA', automacao: 'Automações', loja: 'Loja online', trafego: 'Anúncios', social: 'Social media', video: 'Vídeo', outro: 'Outro' };
const PSTATUS = [['briefing', 'Briefing'], ['producao', 'Em produção'], ['aprovacao', 'Aprovação'], ['publicado', 'Publicado'], ['manutencao', 'Manutenção'], ['pausado', 'Pausado'], ['cancelado', 'Cancelado']];
const PTIPOS = { site: 'Site', cardapio: 'Cardápio', sistema: 'Sistema', loja: 'Loja', video: 'Vídeo', social: 'Redes sociais', trafego: 'Tráfego', outro: 'Outro' };
const ATIPOS = { nota: ['📝', 'Nota'], ligacao: ['📞', 'Ligação'], whatsapp: ['💬', 'WhatsApp'], reuniao: ['🤝', 'Reunião'], email: ['✉️', 'E-mail'], etapa: ['➜', 'Etapa'], tarefa: ['✔', 'Tarefa'], formulario: ['🧾', 'Formulário'], sistema: ['•', 'Sistema'] };
const hoje = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const pessoa = (ap) => ap === 'ambos' ? { nome: 'Os dois', cor: '', apelido: 'ambos' } : (S.equipe.find((e) => e.apelido === ap) || null);
const SOLO = () => S.equipe.filter((e) => e.ativo !== false).length <= 1;
const outro = (ap) => (S.equipe.find((e) => e.apelido !== ap && e.apelido !== 'ambos') || {}).apelido;
const avatar = (ap, tam) => { if (!ap) return ''; const p = pessoa(ap); if (!p) return ''; const tm = tam ? `width:${tam}px;height:${tam}px;font-size:${Math.round(tam * .45)}px;` : ''; return ap === 'ambos' ? `<span class="av ambos" style="${tm}" title="Os dois">2</span>` : `<span class="av" title="${esc(p.nome)}" style="${tm}background:${esc(p.cor)}">${esc(p.nome[0])}</span>`; };
const unidade = (id) => S.unidades.find((u) => u.id === id) || { nome: id || '—', cor: '#999' };
const chipUnidade = (id) => { const u = unidade(id); return `<span class="chip"><span class="ponto" style="background:${esc(u.cor)}"></span>${esc(u.nome)}</span>`; };
const moeda = (v, m = 'BRL') => v == null || v === '' ? '' : Number(v).toLocaleString(m === 'BRL' ? 'pt-BR' : m === 'EUR' ? 'pt-PT' : 'en-US', { style: 'currency', currency: m, maximumFractionDigits: 0 });
const data = (s, hora) => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T12:00:00' : s); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', ...(hora ? { hour: '2-digit', minute: '2-digit' } : {}) }).replace('.', ''); };
const relativo = (s) => { const m = (Date.now() - new Date(s)) / 6e4; if (m < 1) return 'agora'; if (m < 60) return Math.round(m) + ' min'; if (m < 1440) return Math.round(m / 60) + ' h'; if (m < 10080) return Math.round(m / 1440) + ' d'; return data(s); };
const prazoChip = (p, feita) => { if (!p) return ''; const h = hoje(); if (feita) return `<span class="chip">${data(p)}</span>`; if (p < h) return `<span class="chip alerta">Atrasada · ${data(p)}</span>`; if (p === h) return `<span class="chip verde">Hoje</span>`; return `<span class="chip">${data(p)}</span>`; };
const doFiltroUnidade = (x) => S.unidade === 'todas' || x.unidade === S.unidade;
const hashAtual = () => { try { return location.hash.slice(1); } catch { return ''; } };
const trocarEndereco = (u) => { try { history.replaceState(null, '', u); } catch {} };
const telLimpo = (t) => String(t || '').replace(/\D/g, '');

function toast(msg, tipo, acao) {
  const t = document.createElement('div'); t.className = 'toast' + (tipo === 'erro' ? ' erro' : ''); t.innerHTML = `<span>${esc(msg)}</span>`;
  if (acao) { const b = document.createElement('button'); b.textContent = acao.rot; b.onclick = () => { acao.fn(); t.remove(); }; t.appendChild(b); }
  const caixa = $('#toasts'); caixa.appendChild(t); while (caixa.children.length > 3) caixa.firstElementChild.remove(); setTimeout(() => t.remove(), acao ? 7000 : 3000);
}
const falha = (e) => { console.error(e); toast(A.mensagem(e), 'erro'); };

// ---------- tema ----------
function aplicarTema(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
aplicarTema(A.local.get('crm-tema'));
$('#bTema').onclick = () => { const atual = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const n = atual === 'dark' ? 'light' : 'dark'; A.local.set('crm-tema', n); aplicarTema(n); };

// ---------- login ----------
let modoRecuperar = false;
async function iniciar() {
  try {
    if (/[?&]nova=1/.test(location.search) || /type=recovery/.test(location.hash)) { await esperarSessaoRecuperacao(); mostrar('nova'); return; }
    const s = await A.sessao();
    if (!s) return mostrar('login');
    await carregarTudo(); mostrar('app');
  } catch (e) { console.error(e); if (A.codigo(e) === 'sem_acesso') { await A.sair(); mostrar('login'); $('#lErro').textContent = A.mensagem(e); } else { mostrar('login'); $('#lErro').textContent = A.mensagem(e); } }
}
async function esperarSessaoRecuperacao() { for (let i = 0; i < 20; i++) { if (await A.sessao()) return; await new Promise((r) => setTimeout(r, 150)); } }
function mostrar(o) {
  $('#inicio').hidden = true; $('#login').hidden = o === 'app'; $('#app').hidden = o !== 'app';
  $('#fLogin').hidden = o !== 'login'; $('#fNova').hidden = o !== 'nova';
  if (o === 'app') { $('#faixaDemo').hidden = !A.modoDemo; irPara(hashAtual() || 'inicio', true); assinar(); }
}
$('#fLogin').onsubmit = async (ev) => {
  ev.preventDefault(); const b = $('#lBtn'); $('#lErro').textContent = ''; b.disabled = true;
  try {
    if (modoRecuperar) { await A.recuperar($('#lEmail').value.trim()); $('#lErro').style.color = 'var(--ok)'; $('#lErro').textContent = 'Se o e-mail for da equipe, chegou um link para criar a senha.'; return; }
    await A.entrar($('#lEmail').value.trim(), $('#lSenha').value); await carregarTudo(); mostrar('app');
  } catch (e) { $('#lErro').style.color = ''; $('#lErro').textContent = A.mensagem(e); } finally { b.disabled = false; }
};
$('#lEsqueci').onclick = () => { modoRecuperar = !modoRecuperar; $('#blSenha').hidden = modoRecuperar; $('#lSenha').required = !modoRecuperar; $('#lBtn').textContent = modoRecuperar ? 'Enviar link' : 'Entrar'; $('#lEsqueci').textContent = modoRecuperar ? 'Voltar para entrar' : 'Esqueci a senha'; $('#lErro').textContent = ''; };
$('#fNova').onsubmit = async (ev) => { ev.preventDefault(); try { await A.novaSenha($('#nSenha').value); trocarEndereco(location.pathname); await carregarTudo(); mostrar('app'); toast('Senha salva.'); } catch (e) { $('#nErro').textContent = A.mensagem(e); } };
$('#bSair').onclick = async () => { await A.sair(); location.hash = ''; location.reload(); };
$('#bResetDemo').onclick = () => { A.resetarDemo(); location.reload(); };

// ---------- dados ----------
async function carregarTudo() { const d = await A.carregar(); Object.assign(S, d); montarUnidades(); contadores(); $('#euBox').innerHTML = `${avatar(S.eu, 28)}<div><b>${esc(pessoa(S.eu)?.nome || S.eu)}</b><div class="muted peq">${A.modoDemo ? 'prévia' : 'conectado'}</div></div>`; }
let recarregando = null;
function recarregar() { clearTimeout(recarregando); recarregando = setTimeout(async () => { try { await carregarTudo(); render(); } catch (e) { falha(e); } }, 400); }
let assinado = false;
async function assinar() {
  if (assinado) return; assinado = true;
  try {
    await A.assinar((tabela, tipo, row) => {
      if (tipo === 'INSERT' && tabela === 'contatos' && row.origem === 'formulario') toast('Novo lead pelo formulário: ' + (row.nome || ''), '', { rot: 'Abrir', fn: () => abrirContato(row.id) });
      else if (tipo === 'INSERT' && tabela === 'emails' && row.direcao === 'recebido') toast('E-mail novo: ' + (row.assunto || ''));
      else if (tipo === 'INSERT' && tabela === 'tarefas' && row.criado_por !== S.eu && (row.responsavel === S.eu || row.responsavel === 'ambos')) toast('Nova tarefa para você: ' + (row.titulo || ''));
      else if (tipo === 'UPDATE' && tabela === 'tarefas' && row.responsavel === S.eu && (S.tarefas.find((t) => t.id === row.id) || {}).responsavel !== S.eu) toast('Passaram uma tarefa para você: ' + (row.titulo || ''));
      recarregar();
    });
  } catch (e) { console.warn('tempo real indisponível', e); }
}
function montarUnidades() {
  const sel = $('#selUnidade'); sel.innerHTML = `<option value="todas">Todas as unidades</option>` + S.unidades.filter((u) => u.ativo !== false).map((u) => `<option value="${esc(u.id)}">${esc(u.nome)}</option>`).join('') + '<option value="__nova__">+ Nova unidade…</option>';
  if (![...sel.options].some((o) => o.value === S.unidade)) S.unidade = 'todas'; sel.value = S.unidade;
}
$('#selUnidade').onchange = (e) => { if (e.target.value === '__nova__') return; S.unidade = e.target.value; A.local.set('crm-unidade', S.unidade); render(); };
function contadores() {
  const novos = S.contatos.filter((c) => c.etapa === 'novo' && !c.arquivado).length;
  const minhas = S.tarefas.filter((t) => t.status !== 'feita' && (t.responsavel === S.eu || t.responsavel === 'ambos')).length;
  const nl = S.emails.filter((e) => !e.lido && e.direcao === 'recebido').length;
  [['#cLeads', novos], ['#cTarefas', minhas], ['#cEmails', nl], ['#cPastas', (S.arquivos || []).filter((a) => a.status === 'duvida').length], ['#cLemb', (S.lembretes || []).filter((l) => !l.feito && new Date(l.quando) < new Date() && (l.para === S.eu || l.para === 'ambos')).length]].forEach(([s, n]) => { $(s).hidden = !n; $(s).textContent = n; });
}
async function salvar(tabela, row, msg) {
  try { const r = await A.salvar(tabela, row); const lista = S[tabela]; const i = lista.findIndex((x) => x.id === r.id); if (i >= 0) lista[i] = r; else lista.unshift(r); contadores(); if (msg) toast(msg); return r; }
  catch (e) { falha(e); throw e; }
}

// ---------- navegação ----------

    const cs = cols.filter((c) => c.tipo !== 'senha'); const csv = '﻿' + cs.map((c) => cel(c.nome)).join(';') + '\n' + linhas.map((l) => cs.map((c) => cel(l.valores?.[c.id])).join(';')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = p.nome.replace(/[^\w-]+/g, '-') + '.csv'; a.click(); };
}
function trocarMestra(p) {
  const { v, fechar } = abrirVeu(`<div class="modal" style="width:min(440px,100%)"><header><h3>🔑 Trocar senha-mestra</h3><button class="x" aria-label="Fechar">×</button></header><form class="miolo" id="fTm">
    <div><label class="rot">Senha-mestra atual</label><input class="campo" type="password" id="tmA" required autocomplete="current-password"></div>
    <div><label class="rot">Nova senha-mestra (mínimo 8 caracteres)</label><input class="campo" type="password" id="tmN1" required minlength="8" autocomplete="new-password"></div>
    <div><label class="rot">Repita a nova</label><input class="campo" type="password" id="tmN2" required autocomplete="new-password"></div>
    <p class="muted peq" style="margin:0">Todas as senhas de "${esc(p.nome)}" são criptografadas de novo com a nova senha-mestra. Ela não fica salva em lugar nenhum: se esquecer, não dá para recuperar.</p>
    <footer style="padding:0;border:0"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri" id="tmB">Trocar</button></footer></form></div>`, true);
  $('#tmA', v).focus();
  $('#fTm', v).onsubmit = async (e) => {
    e.preventDefault(); const n1 = $('#tmN1', v).value, n2 = $('#tmN2', v).value;
    if (n1.length < 8) return toast('Nova senha-mestra com pelo menos 8 caracteres.', 'erro');
    if (n1 !== n2) return toast('As novas senhas não conferem.', 'erro');
    const b = $('#tmB', v); b.disabled = true; b.textContent = 'Trocando…';
    try {
      const velha = await A.cofre.abrir(p.cofre, $('#tmA', v).value);
      const cols = (p.colunas || []).filter((c) => c.tipo === 'senha');
      const linhas = await A.linhasPlanilha(p.id);
      const nova = await A.cofre.criar(n1);
      // decifra tudo antes de gravar qualquer coisa: se algo falhar, nada muda
      const prontas = [];
      for (const l of linhas) { let mudou = false; const valores = { ...(l.valores || {}) };
        for (const c of cols) { const val = valores[c.id]; if (val && val.ct) { valores[c.id] = await A.cofre.cifrar(nova.k, await A.cofre.decifrar(velha, val)); mudou = true; } }
        if (mudou) prontas.push({ id: l.id, valores }); }
      for (const r of prontas) await A.salvar('planilha_linhas', r);
      const r = await salvar('planilhas', { id: p.id, cofre: nova.info }, 'Senha-mestra trocada');
      chavesCofre.set(p.id, nova.k); fechar(); render();
    } catch (er) { falha(er); b.disabled = false; b.textContent = 'Trocar'; }
  };
}
function abrirCofre(p) {
  const { v, fechar } = abrirVeu(`<div class="modal" style="width:min(420px,100%)"><header><h3>🔐 Abrir cofre</h3><button class="x" aria-label="Fechar">×</button></header><form class="miolo" id="fCf"><label class="rot">Senha-mestra de "${esc(p.nome)}"</label><input class="campo" type="password" id="cfS" required autocomplete="current-password"><p class="muted peq" style="margin:0">Fica aberto só nesta aba até você trancar ou recarregar a página.</p><footer style="padding:0;border:0"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn pri" id="cfB">Abrir</button></footer></form></div>`, true);
  $('#cfS', v).focus();
  $('#fCf', v).onsubmit = async (e) => { e.preventDefault(); const b = $('#cfB', v); b.disabled = true; b.textContent = 'Abrindo…'; try { chavesCofre.set(p.id, await A.cofre.abrir(p.cofre, $('#cfS', v).value)); fechar(); render(); } catch (er) { falha(er); b.disabled = false; b.textContent = 'Abrir'; } };
}

// ---------- assistente de IA ----------
const conversaIA = [];
function abrirIA() {
  if ($('#iaPainel')) return $('#iaTx').focus();
  const p = document.createElement('div'); p.id = 'iaPainel'; p.className = 'ia-painel';
  p.innerHTML = `<header><b>✨ Assistente do CRM</b><span class="muted peq" style="margin-left:6px">cria tarefas, lembretes, contatos e projetos</span><button class="x" id="iaX" aria-label="Fechar" style="margin-left:auto">×</button></header><div class="ia-msgs" id="iaM"></div>
    <form class="ia-form" id="iaF"><textarea class="campo" id="iaTx" rows="2" placeholder='Ex.: "cria uma tarefa pra amanhã postar os stories" ou "me lembra sexta 9h de ligar pro Jota"'></textarea><button class="btn pri" id="iaB">Enviar</button></form>`;
  document.body.appendChild(p);
  const desenhar = () => { $('#iaM').innerHTML = (conversaIA.length ? '' : `<div class="ia-dica">Exemplos:<br>• "quais tarefas estão atrasadas?"<br>• "cadastra a Pizzaria Bella, telefone 47 99999-0000, quer cardápio"<br>• "o que tenho pra fazer hoje?"<br>• "cria o projeto Loja da Mantoo começando dia 1/12"<br>• "me lembra amanhã 10h de mandar a proposta da Rita"</div>`) +
    conversaIA.map((m) => `<div class="ia-b ${m.papel}">${esc(m.texto).replace(/\n/g, '<br>')}${m.acoes?.length ? `<div class="peq" style="opacity:.75;margin-top:4px">${m.acoes.map((a) => (a.ok ? '✔ ' : '✖ ') + a.ferramenta.replace(/_/g, ' ')).join(' · ')}</div>` : ''}</div>`).join(''); $('#iaM').scrollTop = 1e9; };
  desenhar(); $('#iaTx').focus();
  $('#iaX').onclick = () => p.remove();
  $('#iaTx').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#iaF').requestSubmit(); } };
  $('#iaF').onsubmit = async (e) => {
    e.preventDefault(); const t = $('#iaTx').value.trim(); if (!t) return; conversaIA.push({ papel: 'eu', texto: t }); $('#iaTx').value = ''; desenhar();
    const b = $('#iaB'); b.disabled = true; b.textContent = '…'; $('#iaM').insertAdjacentHTML('beforeend', '<div class="ia-b ia" id="iaPensa"><span class="giro" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle"></span></div>'); $('#iaM').scrollTop = 1e9;
    try { const r = await A.ia(conversaIA.slice(-12).map(({ papel, texto }) => ({ papel, texto }))); conversaIA.push({ papel: 'ia', texto: r.texto, acoes: r.acoes }); if (r.acoes?.some((a) => a.ok)) { try { await carregarTudo(); render(); } catch {} } }
    catch (er) { conversaIA.push({ papel: 'ia', texto: A.mensagem(er) }); }
    b.disabled = false; b.textContent = 'Enviar'; if ($('#iaPainel')) { desenhar(); $('#iaTx').focus(); }
  };
}

    <div class="cartao"><div class="cab"><h3>Equipe</h3></div><div class="lista-itens">${S.equipe.map((e) => `<div style="cursor:default">${avatar(e.apelido, 26)}<span style="flex:1"><b>${esc(e.nome)}</b> <span class="muted peq">${esc(e.email || '')}</span></span><span class="ponto" style="background:${esc(e.cor)}"></span></div>`).join('')}</div></div>

  desenharMod(); $('#bNovoMod').onclick = () => editarModelo({}, desenharMod);
  const desenharUn = () => { $('#lUn').innerHTML = S.unidades.slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0)).map((u) => `<div data-un="${esc(u.id)}"><span class="ponto" style="background:${esc(u.cor)}"></span><span style="flex:1;min-width:0"><b>${esc(u.nome)}</b> <span class="muted peq">${u.ativo === false ? 'arquivada' : esc(u.descricao || '')}</span></span><span class="muted">›</span></div>`).join(''); $$('#lUn [data-un]').forEach((d) => (d.onclick = () => editarUnidade(S.unidades.find((u) => u.id === d.dataset.un), () => desenharUn()))); };

function editarModelo(m0, depois) {
  const m = { idioma: 'pt-BR', ...m0 }, novo = !m.id;
  const { v, fechar } = abrirVeu(`<div class="modal"><header><h3>${novo ? 'Novo modelo' : 'Modelo'}</h3><button class="x" aria-label="Fechar">×</button></header>
    <form class="miolo" id="fMod"><div class="grade g2"><div><label class="rot">Nome do modelo *</label><input class="campo" name="titulo" required maxlength="80" value="${esc(m.titulo || '')}"></div>
    <div><label class="rot">Idioma</label><select class="campo" name="idioma">${opcoes({ 'pt-BR': 'Português (BR)', 'pt-PT': 'Português (PT)', en: 'Inglês' }, m.idioma)}</select></div></div>
    <div><label class="rot">Assunto (opcional, para e-mail novo)</label><input class="campo" name="assunto" maxlength="200" value="${esc(m.assunto || '')}"></div>
    <div><label class="rot">Texto *</label><textarea class="campo" name="corpo" rows="8" required>${esc(m.corpo || '')}</textarea></div>

  $('#modApagar', v)?.addEventListener('click', async () => { if (!confirm('Apagar este modelo?')) return; try { await A.apagar('modelos', m.id); S.modelos = S.modelos.filter((x) => x.id !== m.id); fechar(); depois?.(); } catch (e) { falha(e); } });
  $('#fMod', v).onsubmit = async (e) => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)); d.titulo = d.titulo.trim(); d.assunto = d.assunto.trim() || null; d.corpo = d.corpo.trim(); try { await salvar('modelos', novo ? { ...d, ordem: S.modelos.length + 1 } : { id: m.id, ...d }, 'Modelo salvo'); fechar(); depois?.(); } catch {} };
}
function linkForm(rede) { const base = A.config.formularioUrl || 'https://SEU-FORMULARIO.vercel.app'; return base.replace(/\/$/, '') + '/?utm_source=' + rede + '&utm_medium=bio'; }
$('#bLinkForm').onclick = () => { if (!A.config.formularioUrl) toast('Coloque o endereço do formulário no config.js (formularioUrl). Copiei o modelo.'); copiar(linkForm('instagram')); };

// ---------- busca global ----------
function abrirBusca() {
  if ($('#buscaG')) return;
  const { v, fechar } = abrirVeu(`<div class="modal" id="buscaG"><div class="miolo"><input class="campo" id="bgq" placeholder="Buscar contato, empresa, tarefa, trabalho, projeto, e-mail…" autocomplete="off" style="font-size:16px;padding:11px 12px"><div class="busca-res" id="bgr"></div></div></div>`, true);
  const inp = $('#bgq', v); inp.focus(); let sel = 0, res = [];
  const run = () => {
    const q = inp.value.toLowerCase().trim(); res = [];
    if (q.length >= 2) {
      S.contatos.forEach((c) => { if ([c.nome, c.empresa, c.email, c.telefone, c.instagram, c.nicho, c.cidade].some((x) => String(x || '').toLowerCase().includes(q))) res.push({ ic: '👤', t: c.nome, s: [c.empresa, ETAPA[c.etapa]?.n].filter(Boolean).join(' · '), go: () => abrirContato(c.id) }); });
      S.tarefas.forEach((t) => { if (t.titulo.toLowerCase().includes(q)) res.push({ ic: t.status === 'feita' ? '☑' : '☐', t: t.titulo, s: 'Tarefa · ' + (pessoa(t.responsavel)?.nome || ''), go: () => editarTarefa(t) }); });
      S.planos.forEach((p) => { if ((p.nome + ' ' + (p.ideias || '')).toLowerCase().includes(q)) res.push({ ic: '⭐', t: p.nome, s: 'Projeto · ' + (PLN[p.status]?.n || ''), go: () => editarPlano(p) }); });
      S.lembretes.forEach((l) => { if (l.titulo.toLowerCase().includes(q)) res.push({ ic: '⏰', t: l.titulo, s: 'Lembrete · ' + quandoTexto(l.quando), go: () => editarLembrete(l) }); });
      S.planilhas.forEach((p) => { if (p.nome.toLowerCase().includes(q)) res.push({ ic: '📋', t: p.nome, s: 'Formulário', go: () => { S.planilhaAtual = p.id; irPara('formularios'); } }); });
      S.pastas.forEach((p) => { if (p.nome.toLowerCase().includes(q)) res.push({ ic: '📁', t: p.nome, s: 'Pasta', go: () => { S.pastaAtual = p.id; irPara('pastas'); } }); });
      S.arquivos.forEach((a) => { if (a.nome.toLowerCase().includes(q) || (a.nota || '').toLowerCase().includes(q)) res.push({ ic: a.status === 'feito' ? '✔' : '🖼', t: a.nome, s: 'Arquivo · ' + (S.pastas.find((p) => p.id === a.pasta_id)?.nome || ''), go: () => abrirArquivo(a.id, [a.id]) }); });
      S.projetos.forEach((p) => { if (p.nome.toLowerCase().includes(q)) res.push({ ic: '📁', t: p.nome, s: 'Trabalho', go: () => editarProjeto(p) }); });
      S.emails.forEach((e) => { if ([e.assunto, e.de, e.de_nome].some((x) => String(x || '').toLowerCase().includes(q))) res.push({ ic: '✉️', t: e.assunto || '(sem assunto)', s: e.de_nome || e.de, go: () => abrirEmail(e.id) }); });
    }
    res = res.slice(0, 30); sel = 0; desenhar();
  };
  const desenhar = () => { $('#bgr', v).innerHTML = res.map((r, i) => `<div data-i="${i}" class="${i === sel ? 'sel' : ''}"><span>${r.ic}</span><span style="flex:1;min-width:0"><b>${esc(r.t)}</b> <span class="muted peq">${esc(r.s)}</span></span></div>`).join('') || (inp.value.trim().length >= 2 ? '<p class="vazio">Nada encontrado.</p>' : '<p class="vazio">Digite pelo menos 2 letras.</p>'); $$('#bgr [data-i]', v).forEach((d) => (d.onclick = () => { fechar(); res[d.dataset.i].go(); })); };
  inp.oninput = run; run();
  inp.onkeydown = (e) => { if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); desenhar(); e.preventDefault(); } if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); desenhar(); e.preventDefault(); } if (e.key === 'Enter' && res[sel]) { fechar(); res[sel].go(); } };
}

document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && !$('#app').hidden) { e.preventDefault(); abrirBusca(); } });

iniciar();
})();
